name: Latest Home Assistant compatibility
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install latest stable HA test harness and protocol dependencies
        run: |
          pip install --upgrade pytest-homeassistant-custom-component homeassistant
          pip install 'awscrt==0.36.1' 'awsiotsdk==1.31.0'
          pip freeze > compatibility-versions.txt
      - name: Run full suite against latest stable
        run: python -m pytest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-versions
          path: compatibility-versions.txt
