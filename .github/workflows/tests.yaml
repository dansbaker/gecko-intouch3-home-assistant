name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Verify the standalone client is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('gecko_iot_client') is None"
      - name: Run integration and bundled client tests
        run: python -m pytest --cov=custom_components.gecko --cov-branch --cov-report=term --cov-report=json:coverage.json
      - name: Enforce full config-flow coverage
        run: python script/check_config_flow_coverage.py coverage.json
      - name: Enforce completed entity coverage targets
        run: python script/check_entity_coverage.py coverage.json
